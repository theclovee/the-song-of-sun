<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RARE Watermelon Game 🍉</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Pustaka Fisika Matter.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #ecfdf5;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }

    /* Tombol Mute / Unmute Musik */
    .music-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #10b981;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 100;
    }

    .header-bar {
      width: 100%;
      max-width: 500px;
      padding: 10px 15px 5px 15px;
      text-align: center;
    }

    h1 {
      color: #059669;
      font-size: 20px;
      margin: 0 0 2px 0;
      font-weight: 700;
    }
    .subtitle {
      font-size: 12px;
      color: #047857;
      font-weight: 600;
      margin: 0 0 8px 0;
    }

    /* Scoreboard Bar Compact */
    .score-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #d1fae5;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .preview-img-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      border: 2px solid #059669;
    }

    /* Full Screen Game Container */
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 500px;
      flex: 1;
      background: #f0fdf4;
      border-top: 3px solid #34d399;
      overflow: hidden;
      touch-action: none;
    }

    .danger-line {
      position: absolute;
      top: 65px;
      left: 0;
      width: 100%;
      border-top: 2px dashed #ef4444;
      z-index: 10;
      pointer-events: none;
    }
    .danger-label {
      position: absolute;
      top: 47px;
      right: 10px;
      font-size: 10px;
      color: #ef4444;
      font-weight: 700;
    }

    /* Welcome Screen & Overlay Game Over */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(236, 253, 245, 0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #065f46;
      z-index: 30;
      padding: 20px;
      text-align: center;
    }
    .welcome-emoji {
      font-size: 65px;
      margin-bottom: 10px;
    }
    .welcome-text {
      font-size: 13px;
      color: #047857;
      line-height: 1.6;
      margin-bottom: 25px;
      max-width: 320px;
    }

    .gameover-overlay {
      background: rgba(0, 0, 0, 0.82);
      color: white;
    }
    .gameover-overlay h2 {
      font-size: 22px;
      color: #fca5a5;
      margin-bottom: 5px;
    }
    .high-score-tag {
      font-size: 12px;
      color: #fcd34d;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .start-btn {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }

    .footer-bar {
      padding: 8px 0;
      width: 100%;
      text-align: center;
      background: #ecfdf5;
    }
    .back-btn {
      color: #059669;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Audio Musik & Tombol Sound -->
  <audio id="bg-music" loop src="lagu-watermelon.mp3"></audio>
  <button id="music-toggle" class="music-btn">🎵</button>

  <!-- Header Info -->
  <div class="header-bar">
    <h1>RARE Watermelon Game 🍉</h1>
    <div class="score-container" id="scoreBar" style="visibility: hidden;">
      <div>Skor: <span id="scoreText">0</span></div>
      <div>Rekor: <span id="highScoreText">0</span></div>
      <div>Berikutnya: <img id="nextPreviewImg" class="preview-img-badge" src="level1.jpg" alt="Next"></div>
    </div>
  </div>

  <!-- Arena Game Full Screen Viewport -->
  <div id="game-container">
    <div class="danger-line"></div>
    <div class="danger-label">⚠️</div>

    <!-- Screen Pembuka -->
    <div id="welcomeScreen" class="overlay">
      <div class="welcome-emoji">🍉</div>
      <p class="subtitle">Inilah Gim Watermelon Paling Lejat dan Begiji</p>
      <div class="welcome-text">
        Gabungkan foto sejenis untuk membentuk ukuran foto yang lebih besar sampai menjadi <b>Foto Raksasa Ultimate (Level 8)</b>!
      </div>
      <button class="start-btn" onclick="startFromWelcome()">▶️ Mulai Permainan</button>
    </div>

    <!-- Overlay Game Over -->
    <div id="gameOverOverlay" class="overlay gameover-overlay" style="display: none;">
      <h2>GAME OVER! 💔</h2>
      <p id="gameOverScore">Skor Akhir: 0</p>
      <div id="highScoreNotice" class="high-score-tag"></div>
      <button class="start-btn" onclick="restartGame()">🔄 Lagi Bg</button>
    </div>
  </div>

  <div class="footer-bar">
    <a href="index.html" class="back-btn">⬅️ Kembali ke Beranda</a>
  </div>

  <script>
    // DATA HIERARKI 8 TINGKAT FOTO (level1.jpg S.D level8.jpg)
    const PHOTO_LEVELS = [
      { level: 1, radius: 18, src: "level1.jpg", score: 2 },
      { level: 2, radius: 26, src: "level2.jpg", score: 4 },
      { level: 3, radius: 36, src: "level3.jpg", score: 8 },
      { level: 4, radius: 48, src: "level4.jpg", score: 16 }, // Batas Drop Maksimal
      { level: 5, radius: 62, src: "level5.jpg", score: 32 },
      { level: 6, radius: 78, src: "level6.jpg", score: 64 },
      { level: 7, radius: 96, src: "level7.jpg", score: 128 },
      { level: 8, radius: 118, src: "level8.jpg", score: 256 } // Raksasa Ultimate
    ];

    // PRELOAD FOTO
    const loadedImages = [];
    PHOTO_LEVELS.forEach((item, index) => {
      const img = new Image();
      img.src = item.src;
      loadedImages[index] = img;
    });

    // WEBAUDIO SOUND EFFECTS
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'merge') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'drop') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    // BG MUSIC SYSTEM
    const bgMusic = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');

    function playMusic() {
      bgMusic.play().then(() => {
        musicBtn.innerText = '🎵';
      }).catch(() => {
        musicBtn.innerText = '🔇';
      });
    }

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        playMusic();
      } else {
        bgMusic.pause();
        musicBtn.innerText = '🔇';
      }
    });

    // DINAMIS FULL SCREEN DIMENSI
    const container = document.getElementById("game-container");
    const width = container.clientWidth || Math.min(window.innerWidth, 500);
    const height = container.clientHeight || (window.innerHeight - 120);

    // SETUP MATTER.JS PHYSICS
    const { Engine, Render, Runner, Bodies, Composite, Events } = Matter;

    const engine = Engine.create();
    engine.gravity.y = 1.15;

    const render = Render.create({
      element: container,
      engine: engine,
      options: {
        width: width,
        height: height,
        wireframes: false,
        background: '#f0fdf4'
      }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    // WADAH (DINDING KIRI, KANAN & ALAS BAWAH SESUAI LEBAR LAYAR)
    const wallOptions = { isStatic: true, render: { fillStyle: '#34d399' } };
    const ground = Bodies.rectangle(width / 2, height + 15, width, 30, wallOptions);
    const leftWall = Bodies.rectangle(-15, height / 2, 30, height * 2, wallOptions);
    const rightWall = Bodies.rectangle(width + 15, height / 2, 30, height * 2, wallOptions);

    Composite.add(engine.world, [ground, leftWall, rightWall]);

    // GAME CONTROLS & STATE
    let score = 0;
    let highScore = localStorage.getItem("watermelon_highScore") || 0;
    let isGameOver = false;
    let currentPhotoIndex = 0;
    let nextPhotoIndex = getRandomSpawnPhoto();
    let canDrop = true;
    let currentX = width / 2;
    let dangerTimer = 0;

    document.getElementById("highScoreText").innerText = highScore;

    function getRandomSpawnPhoto() {
      // DIBATASI HANYA FOTO LEVEL 1 S.D LEVEL 4 UNTUK DIJATUHKAN
      return Math.floor(Math.random() * 4);
    }

    function createPhotoBody(x, y, photoIndex, isStatic = false) {
      const item = PHOTO_LEVELS[photoIndex];
      const body = Bodies.circle(x, y, item.radius, {
        isStatic: isStatic,
        restitution: 0.2,
        friction: 0.5,
        render: { fillStyle: 'transparent' }
      });
      body.photoIndex = photoIndex;
      return body;
    }

    // CUSTOM CANVAS RENDER FOTO LINGKARAN
    Events.on(render, 'afterRender', () => {
      const ctx = render.context;
      const bodies = Composite.allBodies(engine.world);

      bodies.forEach(body => {
        if (body.photoIndex !== undefined) {
          const item = PHOTO_LEVELS[body.photoIndex];
          const img = loadedImages[body.photoIndex];
          const radius = item.radius;

          ctx.save();
          ctx.translate(body.position.x, body.position.y);
          ctx.rotate(body.angle);

          // Potong Lingkaran
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          // Gambar Foto Lingkaran
          if (img && img.complete) {
            ctx.drawImage(img, -radius, -radius, radius * 2, radius * 2);
          } else {
            ctx.fillStyle = '#059669';
            ctx.fill();
          }

          // Bingkai Emas Lingkaran
          ctx.beginPath();
          ctx.arc(0, 0, radius - 1, 0, Math.PI * 2);
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#34d399';
          ctx.stroke();

          ctx.restore();
        }
      });

      // Pratinjau Foto Melayang Siap Jatuh
      if (canDrop && !isGameOver) {
        const previewItem = PHOTO_LEVELS[currentPhotoIndex];
        const previewImg = loadedImages[currentPhotoIndex];
        const r = previewItem.radius;

        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.translate(currentX, 35);

        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.clip();

        if (previewImg && previewImg.complete) {
          ctx.drawImage(previewImg, -r, -r, r * 2, r * 2);
        }

        ctx.restore();

        // Garis Putus-Putus Bantuan
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.moveTo(currentX, 35);
        ctx.lineTo(currentX, height);
        ctx.strokeStyle = '#a7f3d0';
        ctx.stroke();
        ctx.restore();
      }
    });

    // GESER & JATUHKAN FOTO
    function handleMove(e) {
      if (!canDrop || isGameOver) return;
      const rect = container.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let x = clientX - rect.left;
      
      const currentRadius = PHOTO_LEVELS[currentPhotoIndex].radius;
      x = Math.max(currentRadius + 5, Math.min(width - currentRadius - 5, x));
      currentX = x;
    }

    function handleDrop() {
      if (!canDrop || isGameOver) return;
      canDrop = false;

      const newBody = createPhotoBody(currentX, 35, currentPhotoIndex, false);
      Composite.add(engine.world, newBody);
      playSound('drop');

      currentPhotoIndex = nextPhotoIndex;
      nextPhotoIndex = getRandomSpawnPhoto();
      document.getElementById("nextPreviewImg").src = PHOTO_LEVELS[nextPhotoIndex].src;

      setTimeout(() => {
        canDrop = true;
      }, 450);
    }

    container.addEventListener("mousemove", handleMove);
    container.addEventListener("touchmove", handleMove);
    container.addEventListener("click", handleDrop);
    container.addEventListener("touchend", handleDrop);

    // MERGE FOTO SEJENIS
    Events.on(engine, 'collisionStart', (event) => {
      if (isGameOver) return;

      event.pairs.forEach(pair => {
        const { bodyA, bodyB } = pair;

        if (
          bodyA.photoIndex !== undefined &&
          bodyB.photoIndex !== undefined &&
          bodyA.photoIndex === bodyB.photoIndex
        ) {
          const currentIndex = bodyA.photoIndex;

          if (currentIndex < PHOTO_LEVELS.length - 1) {
            const newX = (bodyA.position.x + bodyB.position.x) / 2;
            const newY = (bodyA.position.y + bodyB.position.y) / 2;
            const nextIndex = currentIndex + 1;

            Composite.remove(engine.world, [bodyA, bodyB]);
            const upgradedBody = createPhotoBody(newX, newY, nextIndex, false);
            Composite.add(engine.world, upgradedBody);

            score += PHOTO_LEVELS[nextIndex].score;
            document.getElementById("scoreText").innerText = score;
            playSound('merge');
          }
        }
      });
    });

    // GAME OVER DETEKSI
    Events.on(engine, 'afterUpdate', () => {
      if (isGameOver) return;

      const bodies = Composite.allBodies(engine.world);
      let isOverflowing = false;

      bodies.forEach(body => {
        if (!body.isStatic && body.position.y - PHOTO_LEVELS[body.photoIndex].radius < 65) {
          isOverflowing = true;
        }
      });

      if (isOverflowing) {
        dangerTimer++;
        if (dangerTimer > 110) {
          triggerGameOver();
        }
      } else {
        dangerTimer = 0;
      }
    });

    function startFromWelcome() {
      document.getElementById("welcomeScreen").style.display = "none";
      document.getElementById("scoreBar").style.visibility = "visible";
      playMusic();
    }

    function triggerGameOver() {
      isGameOver = true;
      playSound('gameover');

      let isNewHigh = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("watermelon_highScore", highScore);
        document.getElementById("highScoreText").innerText = highScore;
        isNewHigh = true;
      }

      document.getElementById("gameOverScore").innerText = `Skor Akhir: ${score}`;
      document.getElementById("highScoreNotice").innerText = isNewHigh ? "🎉 REKOR TERTINGGI BARU! 🎉" : `Rekor Tertinggi: ${highScore}`;
      document.getElementById("gameOverOverlay").style.display = "flex";
    }

    function restartGame() {
      const bodies = Composite.allBodies(engine.world);
      bodies.forEach(body => {
        if (!body.isStatic) {
          Composite.remove(engine.world, body);
        }
      });

      score = 0;
      isGameOver = false;
      dangerTimer = 0;
      canDrop = true;
      currentPhotoIndex = getRandomSpawnPhoto();
      nextPhotoIndex = getRandomSpawnPhoto();
      
      document.getElementById("scoreText").innerText = "0";
      document.getElementById("nextPreviewImg").src = PHOTO_LEVELS[nextPhotoIndex].src;
      document.getElementById("gameOverOverlay").style.display = "none";
    }
  </script>
</body>
</html>
