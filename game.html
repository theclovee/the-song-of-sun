<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Game - Seberapa Tahu Reyen tentang Astra?</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #e6fffa;
      font-family: 'Poppins', sans-serif;
      padding: 30px 15px;
      max-width: 500px;
      margin: 0 auto;
      color: #333;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .quiz-card {
      background: #ffffff;
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(5, 150, 105, 0.15);
      text-align: center;
      position: relative;
    }
    h1 {
      color: #059669;
      font-size: 24px;
      margin-bottom: 5px;
    }
    .subtitle {
      font-size: 13px;
      color: #10b981;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .progress-bar {
      font-size: 12px;
      color: #888;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .question {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 20px;
      line-height: 1.5;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 25px;
    }
    .option-btn {
      background: #f0fdf4;
      border: 2px solid #a7f3d0;
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      color: #065f46;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .option-btn:hover {
      background: #d1fae5;
      border-color: #059669;
    }
    /* Style Opsi yang Sedang Dipilih */
    .option-btn.selected {
      background: #059669;
      color: #ffffff;
      border-color: #047857;
      box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
    }
    
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: all 0.2s ease;
    }
    .btn-prev {
      background-color: #e5e7eb;
      color: #4b5563;
    }
    .btn-next {
      background-color: #059669;
      color: #ffffff;
    }
    .nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .warning-msg {
      color: #dc2626;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      min-height: 18px;
    }
    
    /* Result Section */
    .result-box {
      display: none;
    }
    .big-emoji {
      font-size: 80px;
      margin: 15px 0;
      animation: pop 0.5s ease;
    }
    @keyframes pop {
      0% { transform: scale(0); }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .score-percent {
      font-size: 32px;
      font-weight: 700;
      color: #059669;
      margin-bottom: 10px;
    }
    .result-text {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    .retry-btn {
      background-color: #059669;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      font-family: 'Poppins', sans-serif;
    }
    .back-btn {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #059669;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    
    <!-- Bagian Pertanyaan Kuis -->
    <div id="quiz-box">
      <h1>The Game 🎮</h1>
      <p class="subtitle">Hai Reyen, selamat datang di kuis uji kecocokan dengan Astra!</p>
      
      <div class="progress-bar" id="progress">Pertanyaan 1 dari 10</div>
      <div class="question" id="question-text">Loading Pertanyaan...</div>
      
      <div class="options" id="options-container">
        <!-- Pilihan jawaban dimuat lewat JavaScript -->
      </div>

      <div class="nav-buttons">
        <button class="nav-btn btn-prev" id="prev-btn" onclick="prevQuestion()">⬅️ Balik</button>
        <button class="nav-btn btn-next" id="next-btn" onclick="nextQuestion()">Lanjot ➡️</button>
      </div>

      <div class="warning-msg" id="warning-text"></div>
    </div>

    <!-- Bagian Hasil / Result -->
    <div id="result-box" class="result-box">
      <h1>Hasil Uji Kecocokan!</h1>
      <div class="big-emoji" id="result-emoji">🗿</div>
      <div class="score-percent" id="score-percent">0%</div>
      <div class="result-text" id="result-text">Teks Hasil</div>
      
      <button class="retry-btn" onclick="restartQuiz()">🔄 Ulang Bjir</button>
    </div>

  </div>

  <a href="index.html" class="back-btn">⬅️ Kembali ke Beranda</a>

  <script>
    // DATA PERTANYAAN & JAWABAN
    const questions = [
      {
        question: "1. Buah kesukaan Astra?",
        options: ["Pisang", "Melon", "Semangka", "Duren Montong"],
        correct: 1
      },
      {
        question: "2. Warna kesukaan Astra?",
        options: ["Hitam Legam", "Ijo Metalik", "Pinky Pinky", "Merah Perkasa"],
        correct: 2
      },
      {
        question: "3. Karakter Attack On Titan favorit Astra?",
        options: ["Sasha Imut", "Ereng Yeageh", "Arming Femboy", "Erwing Buntung"],
        correct: 0
      },
      {
        question: "4. Lokasi Heartopia favorit Astra?",
        options: ["Hutan Pinus", "Kampung Nelayan", "Alun-Alun Hato", "Kincir Angin Padang Bunga"],
        correct: 3
      },
      {
        question: "5. Reyeng kesukaan Astra?",
        options: ["Reyeng Manja 🥰", "Reyeng Darkweb 🗿", "Reyeng Nackal 🔞", "Reyeng Bunbun 🍔"],
        correct: 2
      },
      {
        question: "6. Lagu XH favorit Astra?",
        options: ["Pluto", "iNSTEAD", "Happy Death Day", "Freaking Bad"],
        correct: 0
      },
      {
        question: "7. Lagu TXT favorit Astra?",
        options: ["Stick With You", "Deja Vu", "Sugar Rush Ride", "Chasing That Feeling"],
        correct: 3
      },
      {
        question: "8. Makanan kesukaan Astra?",
        options: ["Udang 🍤", "Emi 🍜", "Keju 🧀", "Reyeng 🌑"],
        correct: 3
      },
      {
        question: "9. Genre buku favorit Astra?",
        options: ["Fantasi Dunia Lain", "Sejarah Majapahit", "Misteri Sikopet", "Slice of Life Santai"],
        correct: 2
      },
      {
        question: "10. Enak Enak Kesukaan Astra?",
        options: ["Cium", "Jilat", "Emut", "Semua Jawaban Benar 😎"],
        correct: 3
      }
    ];

    let currentQuestion = 0;
    // Menyimpan jawaban terpilih Reyen (-1 artinya belum diisi)
    let userAnswers = new Array(questions.length).fill(-1);

    function loadQuestion() {
      document.getElementById("warning-text").innerText = "";
      const q = questions[currentQuestion];
      
      document.getElementById("progress").innerText = `Pertanyaan ${currentQuestion + 1} dari ${questions.length}`;
      document.getElementById("question-text").innerText = q.question;

      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (userAnswers[currentQuestion] === index) {
          btn.classList.add("selected");
        }
        btn.innerText = `${String.fromCharCode(65 + index)}. ${opt}`;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
      });

      // Kontrol Tombol Prev
      const prevBtn = document.getElementById("prev-btn");
      if (currentQuestion === 0) {
        prevBtn.style.visibility = "hidden";
      } else {
        prevBtn.style.visibility = "visible";
      }

      // Kontrol Tombol Next
      const nextBtn = document.getElementById("next-btn");
      if (currentQuestion === questions.length - 1) {
        nextBtn.innerText = "Lihat Hasil 🚀";
      } else {
        nextBtn.innerText = "Next ➡️";
      }
    }

    function selectOption(index) {
      userAnswers[currentQuestion] = index;
      document.getElementById("warning-text").innerText = "";
      
      // Update tampilan opsi terpilih
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach((btn, i) => {
        if (i === index) {
          btn.classList.add("selected");
        } else {
          btn.classList.remove("selected");
        }
      });
    }

    function nextQuestion() {
      // Validasi wajib isi
      if (userAnswers[currentQuestion] === -1) {
        document.getElementById("warning-text").innerText = "⚠️ Pilih dulu kocak!";
        return;
      }

      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        loadQuestion();
      } else {
        calculateResult();
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion();
      }
    }

    function calculateResult() {
      let score = 0;
      userAnswers.forEach((ans, index) => {
        if (ans === questions[index].correct) {
          score++;
        }
      });

      document.getElementById("quiz-box").style.display = "none";
      const resultBox = document.getElementById("result-box");
      resultBox.style.display = "block";

      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById("score-percent").innerText = percentage + "%";

      let emoji = "";
      let text = "";

      if (percentage <= 30) {
        emoji = "🗿";
        text = "Jangan maen maen lu ya";
      } else if (percentage <= 50) {
        emoji = "🧐";
        text = "Hm macam tak betul je budak ni";
      } else if (percentage <= 70) {
        emoji = "😐";
        text = "Masih bisa ditoleransi, masih oke";
      } else if (percentage <= 90) {
        emoji = "😎";
        text = "Lumayan lah ni bg, acc.";
      } else {
        emoji = "🔥";
        text = "ANJAY COTY FINAL BOS! RARE JAYA JAYA JAYA!";
      }

      document.getElementById("result-emoji").innerText = emoji;
      document.getElementById("result-text").innerText = text;
    }

    function restartQuiz() {
      currentQuestion = 0;
      userAnswers.fill(-1);
      document.getElementById("quiz-box").style.display = "block";
      document.getElementById("result-box").style.display = "none";
      loadQuestion();
    }

    // Jalankan pertama kali
    loadQuestion();
  </script>
</body>
</html>
