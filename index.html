<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 2nd Anniversary, RARE!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffeef2;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      max-width: 450px;
      width: 100%;
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(214, 51, 132, 0.15);
      text-align: center;
      box-sizing: border-box;
    }
    /* Foto Rasio 16:9 */
    .banner-photo {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 16px;
      border: 3px solid #ff85a2;
      box-shadow: 0 4px 12px rgba(214, 51, 132, 0.15);
      margin-bottom: 15px;
      display: block;
    }
    .heart {
      font-size: 30px;
      animation: pulse 1.2s infinite alternate;
      margin-bottom: 5px;
    }
    @keyframes pulse {
      to { transform: scale(1.18); }
    }
    h1 {
      color: #d63384;
      font-size: 22px;
      margin: 5px 0 8px 0;
    }
    p.sub {
      color: #777;
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .counter-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .counter-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: #fff0f4;
      padding: 15px 8px;
      border-radius: 16px;
      margin-bottom: 25px;
    }
    .time-unit {
      display: flex;
      flex-direction: column;
    }
    .number {
      font-size: 18px;
      font-weight: 700;
      color: #d63384;
    }
    .label {
      font-size: 11px;
      color: #666;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-timeline {
      background-color: #ff85a2;
      color: #ffffff;
    }
    .btn-words {
      background-color: #7209b7;
      color: #ffffff;
    }
    .btn-quiz {
      background-color: #059669;
      color: #ffffff;
    }
    .btn-game {
      background-color: #d97706;
      color: #ffffff;
    }
    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Foto Utama 16:9 -->
    <img src="foto-utama.jpg" alt="Astra & Reyen" class="banner-photo">
    
    <div class="heart">💖</div>
    <h1>Happy 2nd Anniversary, RARE!</h1>
    <p class="sub">Made with love ✨</p>

    <div class="counter-title">Kita Sudah Bersama Selama:</div>
    <div class="counter-box">
      <div class="time-unit"><span class="number" id="days">0</span><span class="label">Hari</span></div>
      <div class="time-unit"><span class="number" id="hours">0</span><span class="label">Jam</span></div>
      <div class="time-unit"><span class="number" id="minutes">0</span><span class="label">Menit</span></div>
      <div class="time-unit"><span class="number" id="seconds">0</span><span class="label">Detik</span></div>
    </div>

    <div class="button-group">
      <a href="linimasa.html" class="btn btn-timeline">📖 The Timeline</a>
      <a href="surat.html" class="btn btn-words">💌 The Words</a>
      <a href="quiz.html" class="btn btn-quiz">📝 The Quiz</a>
      <a href="game.html" class="btn btn-game">🎮 The Game</a>
    </div>
  </div>

  <script>
    // Tanggal Jadian: 22 September 2024
    const startDate = new Date("2024-09-22T00:00:00").getTime();

    function updateCounter() {
      const now = new Date().getTime();
      const difference = now - startDate;

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;
    }

    setInterval(updateCounter, 1000);
    updateCounter();
  </script>
</body>
</html>
